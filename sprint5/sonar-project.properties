# SonarQube analysis config for pst-sprint5 (Laravel API + Angular UI).
# NOTE: values passed on the scanner CLI (-Dsonar.*) or set server-side take
# precedence. If you analyze via CI with -D args, copy the exclusion lines
# below into that invocation (CLI overrides, it does not merge).
sonar.projectKey=pst-sprint5
sonar.projectName=pst-sprint5
sonar.sourceEncoding=UTF-8

# Analyze the API and the UI source; specs are excluded below.
sonar.sources=API,UI/src

# Keep generated, vendored, built and static/training assets out of analysis.
# (These carry many findings that are not maintainable source code.)
sonar.exclusions=**/vendor/**,**/node_modules/**,**/storage/**,**/bootstrap/cache/**,**/public/**,**/dist/**,**/coverage/**,**/resources/views/invoice.blade.php,**/src/assets/*guide*.html,**/*.spec.ts

# Duplicated-code checks are noisy on fixtures/seeders/tests by nature.
sonar.cpd.exclusions=**/database/seeders/**,**/tests/**
